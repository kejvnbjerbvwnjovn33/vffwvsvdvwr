name: chicken_mines
description: "quiz chicken"
publish_to: 'none'
# supp: https://forms.gle/oja7UktxVMc5imcq5

version: 1.0.1+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  get_it: ^7.7.0
  injectable: ^2.4.4
  auto_route: ^8.3.0
  rxdart: ^0.28.0
  provider: ^6.1.4
  dartz: ^0.10.1
  url_launcher: ^6.3.1
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  cupertino_icons: ^1.0.8
  in_app_review: ^2.0.10
  audioplayers: ^6.4.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_gen_runner: ^5.6.0
  flutter_lints: ^5.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.4.13
  auto_route_generator: ^8.1.0
  flutter_launcher_icons: ^0.14.3

flutter_gen:
  integrations:
    flutter_svg: true

flutter_icons:
  ios: true
  remove_alpha_ios: true
  image_path: "assets/applogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/fonts/
    - assets/fonts/Araside.ttf
    - assets/audio/music.mp3

  fonts:
    - family: Araside
      fonts:
        - asset: assets/fonts/Araside.ttf
